<!DOCTYPE html>
<html>
<head>
<title>Home Finder</title>
<style>
body{font-family:Arial;text-align:center;background:#e8f5e9}
.house{background:white;padding:15px;margin:10px;display:inline-block}
</style>
</head>
<body>
<h1>Home Finder</h1>
<input id="city" placeholder="Enter city">
<button onclick="search()">Search</button>

<div id="result">
<div class="house" data-city="Chennai">
<h3>2 BHK Apartment</h3><p>Chennai - ₹40 Lakhs</p>
</div>
<div class="house" data-city="Bangalore">
<h3>3 BHK House</h3><p>Bangalore - ₹65 Lakhs</p>
</div>
</div>

<script>
function search(){
let city=document.getElementById("city").value.toLowerCase();
document.querySelectorAll(".house").forEach(h=>{
h.style.display=h.dataset.city.toLowerCase().includes(city)
?"inline-block":"none";
});
}
</script>
</body>
</html>
