<!DOCTYPE html>
<html>
<head>
<title>Hospital Appointment</title>
<style>
body{font-family:Arial;background:#eaf6ff;text-align:center}
form{background:white;padding:20px;margin:30px auto;width:300px}
input,select,button{margin:8px;padding:10px;width:90%}
</style>
</head>
<body>
<h1>Hospital Appointment System</h1>
<form id="f">
<input placeholder="Patient Name" required>
<input type="email" placeholder="Email" required>
<select required>
<option value="">Select Doctor</option>
<option>General Physician</option>
<option>Cardiologist</option>
<option>Dentist</option>
</select>
<input type="date" required>
<button>Book Appointment</button>
</form>
<p id="out"></p>
<script>
document.getElementById("f").onsubmit=function(e){
e.preventDefault();
document.getElementById("out").innerHTML=
"Appointment booked successfully!";
};
</script>
</body>
</html>
