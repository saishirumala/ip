<!DOCTYPE html>
<html>
<head>
<title>StyleHub</title>
<style>
body{font-family:Arial;text-align:center;background:#fff0f5}
.product{display:inline-block;background:white;padding:20px;margin:10px}
button{padding:8px;background:#d63384;color:white}
</style>
</head>
<body>
<h1>StyleHub Fashion Store</h1>
<select id="category" onchange="filter()">
<option>All</option>
<option>Men</option>
<option>Women</option>
</select>

<div class="product" data-type="Men">
<h3>Men's Shirt</h3><p>₹799</p>
</div>
<div class="product" data-type="Women">
<h3>Women's Dress</h3><p>₹1299</p>
</div>
<div class="product" data-type="Men">
<h3>Men's Jeans</h3><p>₹999</p>
</div>

<script>
function filter(){
let c=document.getElementById("category").value;
document.querySelectorAll(".product").forEach(p=>{
p.style.display=(c=="All"||p.dataset.type==c)
?"inline-block":"none";
});
}
</script>
</body>
</html>
