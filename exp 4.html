
<html>
<body>
<h2>Train Reservation</h2>

Enter Name:
<input id="name"><br><br>

Destination:
<input id="place"><br><br>

<button onclick="book()">Book Ticket</button>

<p id="result"></p>

<script>
function book() {
  let n = document.getElementById("name").value;
  let p = document.getElementById("place").value;

  document.getElementById("result").innerHTML =
    "Train ticket booked for " + n + " to " + p;
}
</script>

</body>
</html>
