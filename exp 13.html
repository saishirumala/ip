<!DOCTYPE html>
<html>
<head>
<title>BlossomGifts</title>
<style>
body{font-family:Arial;text-align:center;background:#fff0f0}
.gift{display:inline-block;background:white;padding:20px;margin:10px}
button{background:#e75480;color:white;padding:10px}
</style>
</head>
<body>
<h1>BlossomGifts</h1>
<p>Send happiness to your loved ones!</p>
<h3>Order Total: ₹<span id="total">0</span></h3>

<div class="gift">
<h3>Rose Bouquet</h3><p>₹500</p>
<button onclick="order(500)">Order</button>
</div>

<div class="gift">
<h3>Gift Box</h3><p>₹800</p>
<button onclick="order(800)">Order</button>
</div>

<div class="gift">
<h3>Chocolate Box</h3><p>₹300</p>
<button onclick="order(300)">Order</button>
</div>

<script>
let total=0;
function order(price){
total+=price;
document.getElementById("total").innerText=total;
alert("Gift added successfully!");
}
</script>
</body>
</html>
