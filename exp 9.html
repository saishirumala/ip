<!DOCTYPE html>
<html>
<head>
<title>TechSavvy Store</title>
<style>
body{font-family:Arial;text-align:center;background:#f1f1f1}
.item{background:white;padding:15px;margin:10px;display:inline-block}
button{padding:8px;background:blue;color:white}
</style>
</head>
<body>
<h1>TechSavvy Gadget Store</h1>
<h3>Cart Total: ₹<span id="total">0</span></h3>

<div class="item">
<h2>Mobile</h2><p>₹15000</p>
<button onclick="add(15000)">Add to Cart</button>
</div>

<div class="item">
<h2>Laptop</h2><p>₹45000</p>
<button onclick="add(45000)">Add to Cart</button>
</div>

<div class="item">
<h2>Headphones</h2><p>₹2000</p>
<button onclick="add(2000)">Add to Cart</button>
</div>

<script>
let total=0;
function add(price){
total+=price;
document.getElementById("total").innerText=total;
}
</script>
</body>
</html>
